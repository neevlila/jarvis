name: J.A.R.V.I.S. Automated CI Pipeline

on:
  push:
    branches: [ main, security-engine-dev ]
  pull_request:
    branches: [ main, security-engine-dev ]

jobs:
  test:
    name: Unit & Security Integration Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Pytest Suite
        id: run_tests
        run: |
          python -m pytest tests/ -v --tb=short | tee test_log.txt
        continue-on-error: true

      - name: Summary & Gate
        if: always()
        run: |
          echo "### Pytest Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A 40 "FAILURES" test_log.txt >> $GITHUB_STEP_SUMMARY || true
          grep -A 40 "ERRORS" test_log.txt >> $GITHUB_STEP_SUMMARY || true
          tail -n 30 test_log.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.run_tests.outcome }}" != "success" ]; then
            echo "Pytest failed!"
            exit 1
          fi
