<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Alt Text Audit Test</title>
</head>
<body>
    <h1>Product Showcase</h1>
    <!-- Missing alt entirely -->
    <img src="/img/product1.jpg">
    <!-- Non-descriptive generic alt -->
    <img src="/img/icon.png" alt="image">
    <!-- Intentional decorative image -->
    <img src="/img/divider.svg" alt="" role="presentation">
    <!-- Good descriptive alt -->
    <img src="/img/laptop.jpg" alt="High-performance workstation laptop with backlit keyboard" loading="lazy">
</body>
</html>
