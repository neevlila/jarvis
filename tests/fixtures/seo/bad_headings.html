<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Poor Heading Structure Test</title>
</head>
<body>
    <!-- Multiple conflicting H1s and skipped levels (H1 directly to H4) -->
    <h1>First Main Heading</h1>
    <p>Some initial text.</p>
    <h1>Second Competing Main Heading</h1>
    <p>Another top-level topic that confuses page hierarchy.</p>
    <h4>Deeply Nested Subsection (Skipped H2 and H3)</h4>
    <p>Skipped headings break semantic document outline.</p>
    <h2></h2> <!-- Empty heading -->
    <h3>   </h3> <!-- Whitespace-only heading -->
</body>
</html>
